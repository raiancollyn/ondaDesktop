name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate tag against package version
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $expected = "v$($package.version)"
          if ($expected -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} não corresponde à versão $expected do package.json."
          }

      - name: Install dependencies
        run: npm ci

      - name: Publish native sidecar
        run: npm run native:publish

      - name: Build installer and publish release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onda-windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
